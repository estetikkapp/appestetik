# Build + release del agente Electron en push de tag `agent-vX.Y.Z`.
#
# Resultado: un release de GitHub con los 3 binarios (Windows .exe, Mac .dmg,
# Linux .AppImage) que la página /agente linkea para descarga.

name: Build agent release

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a usar para el release (ej. agent-v1.0.0)'
        required: true
        default: 'agent-v1.0.0'

# Default GITHUB_TOKEN en repos modernos es read-only. Damos write para
# que electron-builder pueda crear el release y subir los artifacts.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        # Sin cache porque no commiteamos package-lock.json del agent/

      - name: Install dependencies
        working-directory: agent
        run: npm install --no-audit --no-fund

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: agent
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: agent
        run: npm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin code signing — usuarios verán warning de Gatekeeper.
          # Pueden saltarlo con click derecho → Abrir.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: agent
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}
          path: |
            agent/dist/*.exe
            agent/dist/*.dmg
            agent/dist/*.AppImage
            agent/dist/latest*.yml
          if-no-files-found: warn
